<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img"><rect width="880" height="410" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1f2937"><text x="35" y="48" font-size="23" font-weight="700">Purchase share in each data split</text><text x="35" y="132" font-size="17">Training (8,807 sessions)</text><rect x="315" y="110" width="310" height="38" rx="4" fill="#0d9488"/><text x="660" y="135" font-size="18" font-weight="700">15.48%</text><text x="35" y="217" font-size="17">Validation (1,762 sessions)</text><rect x="315" y="195" width="310" height="38" rx="4" fill="#0d9488"/><text x="660" y="220" font-size="18" font-weight="700">15.49%</text><text x="35" y="302" font-size="17">Test (1,761 sessions)</text><rect x="315" y="280" width="309" height="38" rx="4" fill="#0d9488"/><text x="660" y="305" font-size="18" font-weight="700">15.45%</text><text x="35" y="386" font-size="14" fill="#475569">The three groups were built with a duplicate-safe, group-aware split.</text></g></svg>