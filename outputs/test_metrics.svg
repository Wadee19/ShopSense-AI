<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img"><rect width="880" height="410" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1f2937"><text x="35" y="48" font-size="23" font-weight="700">Final held-out test metrics</text><text x="35" y="111" font-size="16">Average precision</text><rect x="210" y="87" width="192" height="32" rx="4" fill="#6366f1"/><text x="417" y="110" font-size="15">0.3913</text><text x="35" y="167" font-size="16">Precision</text><rect x="210" y="143" width="173" height="32" rx="4" fill="#6366f1"/><text x="398" y="166" font-size="15">0.3541</text><text x="35" y="223" font-size="16">Recall</text><rect x="210" y="199" width="236" height="32" rx="4" fill="#6366f1"/><text x="461" y="222" font-size="15">0.4816</text><text x="35" y="279" font-size="16">F1</text><rect x="210" y="255" width="200" height="32" rx="4" fill="#6366f1"/><text x="425" y="278" font-size="15">0.4081</text><text x="35" y="335" font-size="16">ROC-AUC</text><rect x="210" y="311" width="384" height="32" rx="4" fill="#6366f1"/><text x="609" y="334" font-size="15">0.7834</text><text x="35" y="389" font-size="14" fill="#475569">Real frozen test results, not cross-validation scores.</text></g></svg>